<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#168b45"><title>CHECK GIÁ</title>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;font-family:Arial;color:#222}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{background:#168b45;color:white;text-align:center;padding:20px 16px}h1{margin:0;font-size:28px;font-weight:900}header p{margin:5px 0;font-size:14px}
main{padding:16px}.camera{position:relative;background:#111;border-radius:16px;overflow:hidden;aspect-ratio:4/3;display:none}video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:10%;right:10%;top:32%;height:36%;border:3px solid white;border-radius:10px;box-shadow:0 0 0 9999px #0004}.line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#e52b20}
button{width:100%;height:52px;border:0;border-radius:12px;font-size:17px;font-weight:800}.start{background:#168b45;color:#fff}.stop{background:#555;color:#fff;margin-top:8px;display:none}
.status{padding:12px 2px;min-height:42px;font-size:14px;color:#555}.error{color:#c62828;font-weight:700}.manual{display:flex;gap:8px;margin-top:12px}input{flex:1;min-width:0;height:52px;border:2px solid #ddd;border-radius:12px;padding:0 13px;font-size:18px}.manual button{width:110px;background:#168b45;color:#fff;font-size:15px}
.result{display:none;margin-top:14px;border:1px solid #e2e7e4;border-radius:16px;overflow:hidden}.product{padding:17px}.group{color:#168b45;font-size:12px;font-weight:800;text-transform:uppercase}.name{font-size:20px;font-weight:800;line-height:1.3;margin-top:5px}.code{font-size:13px;color:#777;margin-top:7px}
.pricebox{background:#b9251a;color:#fff;padding:16px}.pt{font-size:13px;font-weight:800}.price{font-size:36px;font-weight:900;margin-top:3px}.old{font-size:13px;text-decoration:line-through;margin-top:5px}.info{display:grid;grid-template-columns:1fr 1fr}.cell{padding:14px 16px}.cell+.cell{border-left:1px solid #eee}.lab{font-size:12px;color:#777}.val{font-size:19px;font-weight:800;margin-top:4px}.ok{color:#168b45}.no{color:#c62828}.note{font-size:12px;color:#888;text-align:center;line-height:1.5;margin-top:14px}
</style></head><body><div class="app"><header><h1>CHECK GIÁ</h1><p>Quét mã vạch trực tiếp bằng camera</p></header><main>
<div id="camera" class="camera"><video id="video" muted playsinline></video><div class="frame"></div><div class="line"></div></div>
<button id="start" class="start">📷 BẮT ĐẦU QUÉT</button><button id="stop" class="stop">ĐÓNG CAMERA</button>
<div id="status" class="status">Bấm “BẮT ĐẦU QUÉT”, sau đó đưa mã vạch vào khung.</div>
<div class="manual"><input id="manualCode" inputmode="numeric" placeholder="Hoặc nhập mã vạch..."><button id="manualBtn">TRA GIÁ</button></div>
<div id="result" class="result"><div class="product"><div id="group" class="group"></div><div id="name" class="name"></div><div id="code" class="code"></div></div>
<div class="pricebox"><div class="pt">GIÁ SAU GIẢM</div><div id="price" class="price">—</div><div id="old" class="old"></div></div>
<div class="info"><div class="cell"><div class="lab">GIẢM</div><div id="discount" class="val">—</div></div><div class="cell"><div class="lab">TỒN KHO</div><div id="stock" class="val">—</div></div></div></div>
<div class="note">Camera nhận diện liên tục. Khi đọc được mã, hệ thống tự dừng và tra giá.</div></main></div>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbzOhSO-CqeDIiMQTbDoXnXETvTxAVan4dU5vaZ8zBgUJnr74bviI0QBNMeGKb5UQqz3CQ/exec';let controls=null,scanning=false,lastCode='';
const $=id=>document.getElementById(id);
function msg(t,e){$('status').textContent=t;$('status').className='status'+(e?' error':'')}
async function startScanner(){
 lastCode='';
 if(BACKEND_URL.includes('DAN_URL_')){msg('Anh chưa dán URL Web App Apps Script vào BACKEND_URL.',true);return}
 if(!window.ZXingBrowser){msg('Không tải được bộ quét mã. Kiểm tra Internet.',true);return}
 try{
  $('camera').style.display='block';$('start').style.display='none';$('stop').style.display='block';msg('Đang mở camera...');
  const devices=await ZXingBrowser.BrowserMultiFormatReader.listVideoInputDevices();
  if(!devices.length)throw Error('no camera');
  const d=devices.find(x=>/back|rear|environment|sau/i.test(x.label))||devices[devices.length-1];
  const reader=new ZXingBrowser.BrowserMultiFormatReader();
  controls=await reader.decodeFromVideoDevice(d.deviceId,$('video'),(res)=>{
   if(!scanning||!res)return;const code=res.getText();if(code&&code!==lastCode){lastCode=code;scanning=false;stopScanner();lookup(code)}
  });
  scanning=true;msg('Đưa mã vạch vào khung. Máy sẽ tự nhận diện.');
 }catch(e){console.error(e);stopScanner();msg('Không mở được camera. Hãy cấp quyền Camera và dùng HTTPS.',true)}
}
function stopScanner(){scanning=false;if(controls?.stop)try{controls.stop()}catch(e){}controls=null;$('video').srcObject=null;$('camera').style.display='none';$('start').style.display='block';$('stop').style.display='none'}
function lookup(code){code=String(code||'').trim();if(!code){msg('Vui lòng nhập hoặc quét mã.',true);return}msg('Đang tra giá...');$('result').style.display='none';
 const cb='cg_'+Date.now();window[cb]=d=>{try{if(!d?.found){msg(d?.message||'Không tìm thấy sản phẩm.',true);return}render(d)}finally{delete window[cb];s.remove()}};
 const s=document.createElement('script');s.src=BACKEND_URL+'?barcode='+encodeURIComponent(code)+'&callback='+cb;s.onerror=()=>{msg('Không kết nối được Google Sheet. Kiểm tra URL Web App.',true);delete window[cb];s.remove()};document.body.appendChild(s)}
function render(d){msg('Đã tìm thấy sản phẩm.');$('group').textContent=d.group||'';$('name').textContent=d.name||'';$('code').textContent='Mã: '+(d.barcode||'');$('price').textContent=d.eventPrice||'—';$('old').textContent=d.originalPrice?'Giá gốc: '+d.originalPrice:'';$('discount').textContent=d.discount||'—';const n=String(d.stock||'0');$('stock').textContent=n;$('stock').className='val '+(parseFloat(n.replace(/[^\d.-]/g,''))>0?'ok':'no');$('result').style.display='block'}
$('start').onclick=startScanner;$('stop').onclick=stopScanner;$('manualBtn').onclick=()=>lookup($('manualCode').value);$('manualCode').onkeydown=e=>{if(e.key==='Enter')lookup($('manualCode').value)};
</script></body></html>
